<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NM Project</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #24292f;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 17px;
            color: #d0d7de;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .project-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .project-card h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .file-list {
            display: grid;
            gap: 15px;
        }

        .file {
            background: #f6f8fa;
            padding: 18px;
            border-radius: 10px;
            border: 1px solid #d8dee4;
        }

        .file a {
            text-decoration: none;
            color: #0969da;
            font-size: 17px;
            font-weight: bold;
        }

        .file a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>
        <h1>NM Project</h1>
        <p>Project Documentation</p>
    </header>

    <div class="container">

        <div class="project-card">

            <h2>Project Files</h2>

            <div class="file-list">

                <div class="file">
                    <a href="Phase-1.pdf" target="_blank">
                        📄 Phase 1
                    </a>
                </div>

                <div class="file">
                    <a href="PHASE-2.pdf" target="_blank">
                        📄 Phase 2
                    </a>
                </div>

                <div class="file">
                    <a href="PHASE-3.pdf" target="_blank">
                        📄 Phase 3
                    </a>
                </div>

                <div class="file">
                    <a href="phase%204%20new.pdf" target="_blank">
                        📄 Phase 4
                    </a>
                </div>

                <div class="file">
                    <a href="PHASE-5.pdf" target="_blank">
                        📄 Phase 5
                    </a>
                </div>

                <div class="file">
                    <a href="PHASE-6.pdf" target="_blank">
                        📄 Phase 6
                    </a>
                </div>

                <div class="file">
                    <a href="PHASE-7.pdf" target="_blank">
                        📄 Phase 7
                    </a>
                </div>

            </div>

        </div>

        <footer>
            © 2026 NM Project
        </footer>

    </div>

</body>
</html>
